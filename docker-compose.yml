version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: visiontrace_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visiontrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiontrace_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-visiontrace_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visiontrace -d visiontrace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Background Queue Store
  redis:
    image: redis:7-alpine
    container_name: visiontrace_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visiontrace_backend
    restart: always
    environment:
      ENVIRONMENT: production
      PORT: 8000
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-visiontrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiontrace_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-visiontrace_db}
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_super_secret_jwt_key_2026}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/data/uploads
      - backend_crops:/app/data/crops
      - backend_faiss:/app/data/faiss_indexes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Nginx Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visiontrace_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_crops:
  backend_faiss:
